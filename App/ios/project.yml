name: Selkie
options:
  minimumXcodeGenVersion: 2.38.0
packages:
  AppReveal:
    url: https://github.com/UnlikeOtherAI/AppReveal.git
    from: 0.8.0
  # Official WireGuard Apple package, vendored locally at upstream commit ccc7472 with
  # two minimal build fixes (valid manifest + WireGuardKitC <sys/types.h> include). See
  # Vendor/WireGuardKit/VENDORING.md for the full rationale. The Swift/C targets build
  # via SwiftPM; the Go bridge (libwg-go.a) is produced by a pre-build phase on
  # SelkieTunnelExtension (scripts/build-wireguard-go-bridge.sh), because SwiftPM cannot
  # compile Go.
  WireGuardKit:
    path: Vendor/WireGuardKit
settings:
  base:
    SWIFT_VERSION: 5.10
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
    TARGETED_DEVICE_FAMILY: 1,2
    DEVELOPMENT_TEAM: "59S95D279D"
    # The WireGuard Go bridge only targets arm64 on the iOS Simulator (Go has no
    # ios/amd64 target), so restrict the simulator slice to arm64 across all targets to
    # keep the app and its embedded extension arch-compatible.
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
targets:
  Selkie:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    preBuildScripts:
      - name: SwiftLint
        script: |
          if ! command -v swiftlint >/dev/null 2>&1; then
            echo "error: swiftlint is required to build Selkie"
            exit 1
          fi
          "$SRCROOT/scripts/lint.sh"
        basedOnDependencyAnalysis: false
    sources:
      - path: Selkie
      - path: Shared
    info:
      path: Selkie/Info.plist
      properties:
        UILaunchStoryboardName: LaunchScreen
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: AppReveal uses the local network for debug MCP inspection.
        NSBonjourServices:
          - _appreveal._tcp
        CFBundleURLTypes:
          - CFBundleURLName: com.unlikeotherai.selkie.ios.auth
            CFBundleURLSchemes:
              - selkie
    entitlements:
      path: Selkie/Selkie.entitlements
      properties:
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider
        com.apple.security.application-groups:
          - group.com.unlikeotherai.selkie
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.unlikeotherai.selkie.ios
        PRODUCT_NAME: Selkie
        INFOPLIST_FILE: Selkie/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        ENABLE_TESTABILITY: YES
    dependencies:
      - sdk: AuthenticationServices.framework
      - sdk: CryptoKit.framework
      - sdk: Security.framework
      - sdk: NetworkExtension.framework
      - sdk: UIKit.framework
      - package: AppReveal
        product: AppReveal
      - target: SelkieTunnelExtension
        embed: true
  SelkieTunnelExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    preBuildScripts:
      - name: Build WireGuard Go Bridge
        script: |
          "$SRCROOT/scripts/build-wireguard-go-bridge.sh"
        basedOnDependencyAnalysis: false
      - name: SwiftLint
        script: |
          if ! command -v swiftlint >/dev/null 2>&1; then
            echo "error: swiftlint is required to build SelkieTunnelExtension"
            exit 1
          fi
          "$SRCROOT/scripts/lint.sh"
        basedOnDependencyAnalysis: false
    sources:
      - path: SelkieTunnelExtension
      - path: Shared
    info:
      path: SelkieTunnelExtension/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    entitlements:
      path: SelkieTunnelExtension/SelkieTunnelExtension.entitlements
      properties:
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider
        com.apple.security.application-groups:
          - group.com.unlikeotherai.selkie
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.unlikeotherai.selkie.ios.tunnel
        PRODUCT_NAME: SelkieTunnelExtension
        INFOPLIST_FILE: SelkieTunnelExtension/Info.plist
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
        ENABLE_BITCODE: NO
        LIBRARY_SEARCH_PATHS:
          - $(inherited)
          - $(CONFIGURATION_BUILD_DIR)
        OTHER_LDFLAGS:
          - $(inherited)
          - -lresolv
    dependencies:
      - sdk: NetworkExtension.framework
      - package: WireGuardKit
        product: WireGuardKit
  SelkieTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SelkieTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.unlikeotherai.selkie.ios.tests
        PRODUCT_NAME: SelkieTests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - target: Selkie
schemes:
  Selkie:
    build:
      targets:
        Selkie: all
        SelkieTunnelExtension: all
    test:
      targets:
        - SelkieTests
