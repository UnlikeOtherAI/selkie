name: deploy

# Build the server image on GitHub Actions and transport the immutable commit
# tag to production. The shared Hetzner host only loads and starts the image.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  DEPLOY_HOST: root@178.105.82.46
  DEPLOY_PATH: /srv/selkie

jobs:
  deploy:
    name: deploy to production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: build immutable server image
        run: |
          docker build --pull -t "selkie-server:${GITHUB_SHA}" .
          docker save "selkie-server:${GITHUB_SHA}" | gzip -1 > /tmp/selkie-image.tar.gz

      - name: configure ssh
        env:
          DEPLOY_KEY: ${{ secrets.SELKIE_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.SELKIE_SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: sync deployment files
        run: |
          rsync -az --delete \
            --exclude '/.git' --exclude '/.worktrees' --exclude '/.build' --exclude 'node_modules' \
            --exclude '/.playwright-cli' --exclude '/.playwright-mcp' --exclude '/e2e' \
            --exclude '/App' --exclude '/control-server' --exclude '/control-server-new' \
            --exclude '/*.tar' --exclude '.env' \
            -e "ssh -i $HOME/.ssh/id_deploy -o IdentitiesOnly=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o StrictHostKeyChecking=yes" \
            ./ "$DEPLOY_HOST:$DEPLOY_PATH/"
          scp -i "$HOME/.ssh/id_deploy" -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o StrictHostKeyChecking=yes \
            /tmp/selkie-image.tar.gz "$DEPLOY_HOST:/tmp/selkie-image-${GITHUB_SHA}.tar.gz"

      - name: load, deploy, and verify
        run: |
          ssh -i "$HOME/.ssh/id_deploy" -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o StrictHostKeyChecking=yes \
            "$DEPLOY_HOST" "bash -s -- '$DEPLOY_PATH' '$GITHUB_SHA'" <<'REMOTE'
          set -euo pipefail
          deploy_path=$1
          revision=$2
          archive="/tmp/selkie-image-${revision}.tar.gz"
          trap 'rm -f "$archive"' EXIT
          cd "$deploy_path"

          previous_image=$(docker inspect --format '{{.Config.Image}}' selkie-server 2>/dev/null || true)
          gunzip -c "$archive" | docker load

          if ! SELKIE_IMAGE="selkie-server:${revision}" ./ops/compose-prod.sh up -d --no-build --pull never; then
            echo "New server image failed to start" >&2
            if [ -n "$previous_image" ]; then
              SELKIE_IMAGE="$previous_image" ./ops/compose-prod.sh up -d --no-build --pull never
            fi
            exit 1
          fi

          ready=0
          for i in $(seq 1 30); do
            if curl -fsS --max-time 5 https://api.selkie.live/readyz >/dev/null; then
              echo "readyz OK after $((i * 4))s"
              ready=1
              break
            fi
            sleep 4
          done

          if [ "$ready" -ne 1 ]; then
            echo "Readiness failed; restoring previous server image" >&2
            if [ -n "$previous_image" ]; then
              SELKIE_IMAGE="$previous_image" ./ops/compose-prod.sh up -d --no-build --pull never
            fi
            exit 1
          fi
          REMOTE
